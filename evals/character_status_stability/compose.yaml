name: catchhole-gh126-eval
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    command: [postgres, -c, timezone=Asia/Seoul]
    environment:
      POSTGRES_DB: catchhole_status_eval
      POSTGRES_USER: status_eval
      POSTGRES_PASSWORD: local-status-eval-only
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:25432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U status_eval -d catchhole_status_eval"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.10-alpine3.21
    command: [redis-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1:26379:6379"
