name: Deploy Worker EC2

on:
  workflow_run:
    workflows:
      - Publish AI Image
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-worker-ec2
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: catchhole-soma/catchhole-backend-ai
  BACKEND_REPOSITORY: catchhole-soma/catchhole-backend-java
  BACKEND_DEPLOY_WORKFLOW: deploy-api-ec2.yml
  SPRING_HEALTH_URL: https://api.catchhole.com/actuator/health

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      DEPLOY_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      DEPLOY_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      WORKER_EC2_INSTANCE_ID: ${{ secrets.WORKER_EC2_INSTANCE_ID }}
      WORKER_EC2_DEPLOY_PATH: ${{ secrets.WORKER_EC2_DEPLOY_PATH }}
      WORKER_EC2_DEPLOY_USER: ${{ secrets.WORKER_EC2_DEPLOY_USER }}

    steps:
      - name: Validate Worker deploy settings
        run: |
          set -euo pipefail

          if [ -z "$AWS_REGION" ]; then
            echo "::error::AWS_REGION secret is required."
            exit 1
          fi

          if [ -z "$WORKER_EC2_INSTANCE_ID" ]; then
            echo "::error::WORKER_EC2_INSTANCE_ID secret is required."
            exit 1
          fi

          if [ -z "$AWS_ROLE_TO_ASSUME" ] && { [ -z "$DEPLOY_AWS_ACCESS_KEY_ID" ] || [ -z "$DEPLOY_AWS_SECRET_ACCESS_KEY" ]; }; then
            echo "::error::Set AWS_ROLE_TO_ASSUME for OIDC or set AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY."
            exit 1
          fi

      - name: Wait for Spring deployment and readiness
        timeout-minutes: 20
        run: |
          set -euo pipefail

          API_ROOT="https://api.github.com/repos/$BACKEND_REPOSITORY"

          for i in $(seq 1 20); do
            BACKEND_HEAD_SHA=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_ROOT/commits/main" | jq -r '.sha // empty')

            if [ -z "$BACKEND_HEAD_SHA" ]; then
              echo "::error::Could not resolve the Backend main commit."
              exit 1
            fi

            DEPLOY_STATE=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_ROOT/actions/workflows/$BACKEND_DEPLOY_WORKFLOW/runs?branch=main&head_sha=$BACKEND_HEAD_SHA&per_page=1" \
              | jq -r '.workflow_runs[0] | if . == null then "missing\t" else [.status, (.conclusion // "")] | @tsv end')
            IFS=$'\t' read -r DEPLOY_STATUS DEPLOY_CONCLUSION <<< "$DEPLOY_STATE"

            if [ "$DEPLOY_STATUS" = "completed" ] && [ "$DEPLOY_CONCLUSION" = "success" ]; then
              CURRENT_BACKEND_HEAD_SHA=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API_ROOT/commits/main" | jq -r '.sha // empty')

              if [ "$CURRENT_BACKEND_HEAD_SHA" != "$BACKEND_HEAD_SHA" ]; then
                echo "Backend main advanced while checking deployment. Retrying... ($i/20)"
              elif curl -fsS "$SPRING_HEALTH_URL" >/dev/null; then
                echo "Backend $BACKEND_HEAD_SHA is deployed and Spring is ready."
                break
              else
                echo "Backend deployment succeeded, but Spring is not ready. Retrying... ($i/20)"
              fi
            else
              echo "Backend $BACKEND_HEAD_SHA deploy state is $DEPLOY_STATUS/${DEPLOY_CONCLUSION:-none}. Retrying... ($i/20)"
            fi

            if [ "$i" -eq 20 ]; then
              echo "::error::The latest Backend main commit is not deployed and ready."
              exit 1
            fi

            sleep 45
          done

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: catchhole-worker-github-deploy

      - name: Configure AWS credentials with access keys
        if: ${{ env.AWS_ROLE_TO_ASSUME == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Deploy Worker server with AWS Systems Manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WORKER_EC2_DEPLOY_PATH="${WORKER_EC2_DEPLOY_PATH:-/opt/catchhole}"
          WORKER_EC2_DEPLOY_USER="${WORKER_EC2_DEPLOY_USER:-ubuntu}"
          DEPLOY_SHA='${{ github.event.workflow_run.head_sha }}'

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Publish workflow returned an invalid commit SHA."
            exit 1
          fi

          DEPLOY_SHORT_SHA="${DEPLOY_SHA:0:7}"
          RAW_BASE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEPLOY_SHA/deploy"
          AI_IMAGE="$REGISTRY/$IMAGE_NAME:sha-$DEPLOY_SHORT_SHA"

          cat > /tmp/catchhole-worker-deploy.sh <<EOF
          # AWS-RunShellScript executes this block with /bin/sh, so keep it POSIX-compatible.
          set -eu

          DEPLOY_PATH='$WORKER_EC2_DEPLOY_PATH'
          DEPLOY_USER='$WORKER_EC2_DEPLOY_USER'
          RAW_BASE='$RAW_BASE'
          AI_IMAGE='$AI_IMAGE'

          mkdir -p "\$DEPLOY_PATH"
          curl -fsSL "\$RAW_BASE/compose.worker.prod.yml" -o "\$DEPLOY_PATH/compose.worker.prod.yml"
          test -f "\$DEPLOY_PATH/worker.env"
          grep -q '^AI_IMAGE=' "\$DEPLOY_PATH/worker.env"
          sed -i "s|^AI_IMAGE=.*|AI_IMAGE=\$AI_IMAGE|" "\$DEPLOY_PATH/worker.env"
          chown "\$DEPLOY_USER:\$DEPLOY_USER" "\$DEPLOY_PATH/compose.worker.prod.yml" "\$DEPLOY_PATH/worker.env"

          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml config --quiet"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml pull"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml up -d"
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml ps"

          for i in \$(seq 1 30); do
            ANALYSIS_COUNT=\$(runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml ps --status running -q ai-worker | wc -l | tr -d ' '")
            CHARACTER_COUNT=\$(runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml ps --status running -q ai-character-comparison-worker | wc -l | tr -d ' '")
            WORLD_COUNT=\$(runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml ps --status running -q ai-world-comparison-worker | wc -l | tr -d ' '")

            if [ "\$ANALYSIS_COUNT" -eq 5 ] && [ "\$CHARACTER_COUNT" -eq 1 ] && [ "\$WORLD_COUNT" -eq 1 ]; then
              exit 0
            fi

            echo "Worker process check failed. Retrying in 5 seconds... (\$i/30)"
            sleep 5
          done

          echo "Worker process check failed after retries. Printing container logs."
          runuser -u "\$DEPLOY_USER" -- bash -lc "cd \"\$DEPLOY_PATH\" && docker compose --env-file worker.env -f compose.worker.prod.yml logs --tail=200"
          exit 1
          EOF

          jq -n --rawfile script /tmp/catchhole-worker-deploy.sh '{commands: [$script]}' > /tmp/ssm-worker-parameters.json

          CURRENT_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')
          if [ "$DEPLOY_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "::notice::Skipping superseded publish run for $DEPLOY_SHA; current main is $CURRENT_MAIN_SHA."
            exit 0
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$WORKER_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CatchHole Worker from GitHub Actions run ${GITHUB_RUN_ID}" \
            --parameters file:///tmp/ssm-worker-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "AWS Systems Manager command id: $COMMAND_ID"

          WAIT_STATUS=1
          for i in $(seq 1 180); do
            INVOCATION_STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$WORKER_EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$INVOCATION_STATUS" in
              Success)
                WAIT_STATUS=0
                break
                ;;
              Cancelled|TimedOut|Failed|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$WORKER_EC2_INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json

          exit "$WAIT_STATUS"
