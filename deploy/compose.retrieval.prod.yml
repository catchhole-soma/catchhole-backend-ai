name: catchhole-retrieval
services:
  retrieval-index:
    image: ${AI_IMAGE:?AI_IMAGE is required}
    command: ["python", "-m", "app.retrieval.backfill", "run"]
    init: true
    stop_grace_period: 30s
    restart: "no"
    logging:
      driver: journald
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Seoul}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      SPRING_INTERNAL_API_BASE_URL: ${SPRING_INTERNAL_API_BASE_URL:?SPRING_INTERNAL_API_BASE_URL is required}
      SPRING_INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY:?SPRING_INTERNAL_API_KEY is required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_GENERATION_ENABLED: ${RETRIEVAL_EMBEDDING_GENERATION_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
      RETRIEVAL_BACKFILL_ENABLED: ${RETRIEVAL_BACKFILL_ENABLED:-false}
      RETRIEVAL_BACKFILL_ID: ${RETRIEVAL_BACKFILL_ID:-}
      RETRIEVAL_BACKFILL_MAX_INPUT_TOKENS: ${RETRIEVAL_BACKFILL_MAX_INPUT_TOKENS:-}
      RETRIEVAL_BACKFILL_SCOPE: ${RETRIEVAL_BACKFILL_SCOPE:-}
      RETRIEVAL_BACKFILL_WORK_IDS: ${RETRIEVAL_BACKFILL_WORK_IDS:-}
      RETRIEVAL_BACKFILL_ACTOR: ${RETRIEVAL_BACKFILL_ACTOR:-}
      RETRIEVAL_BACKFILL_STATE_PATH: /var/lib/catchhole-chat/backfill.sqlite3
      RETRIEVAL_BACKFILL_OUTBOX_PATH: /var/lib/catchhole-chat/retrieval.sqlite
      RETRIEVAL_BACKFILL_MAX_SECONDS: ${RETRIEVAL_BACKFILL_MAX_SECONDS:-300}
      RETRIEVAL_BACKFILL_PAGE_SIZE: ${RETRIEVAL_BACKFILL_PAGE_SIZE:-100}
      RETRIEVAL_BACKFILL_MAX_CHUNKS: ${RETRIEVAL_BACKFILL_MAX_CHUNKS:-1000}
      RETRIEVAL_BACKFILL_BATCH_SIZE: ${RETRIEVAL_BACKFILL_BATCH_SIZE:-8}
      RETRIEVAL_BACKFILL_MAX_RETRIES: ${RETRIEVAL_BACKFILL_MAX_RETRIES:-1}
      AI_RUNTIME_API_DB_POOL_SIZE: ${AI_RUNTIME_API_DB_POOL_SIZE:-10}
      AI_RUNTIME_DB_CONNECTION_BUDGET: ${AI_RUNTIME_DB_CONNECTION_BUDGET:-0}
    volumes:
      - retrieval_outbox:/var/lib/catchhole-chat
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
volumes:
  retrieval_outbox:
