name: catchhole-worker

x-worker-environment: &worker-environment
  TZ: ${APP_TIMEZONE:-Asia/Seoul}
  APP_ENV: prod
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-3}
  DATABASE_POOL_MAX_OVERFLOW: ${DATABASE_POOL_MAX_OVERFLOW:-0}
  AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
  AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
  LLM_MODEL: ${LLM_MODEL:-gpt-5.6-terra}
  LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-gpt-5.6-terra}
  LLM_SUBJECT_RESOLUTION_MODEL: ${LLM_SUBJECT_RESOLUTION_MODEL:-gpt-5.6-luna}
  LLM_COMPARISON_MODEL: ${LLM_COMPARISON_MODEL:-gpt-5.6-luna}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
  LLM_SETTING_EXTRACTION_MAX_OUTPUT_TOKENS: ${LLM_SETTING_EXTRACTION_MAX_OUTPUT_TOKENS:-6000}
  LLM_SETTING_EXTRACTION_RETRY_MAX_OUTPUT_TOKENS: ${LLM_SETTING_EXTRACTION_RETRY_MAX_OUTPUT_TOKENS:-12000}
  LLM_WORLD_SETTING_EXTRACTION_MAX_OUTPUT_TOKENS: ${LLM_WORLD_SETTING_EXTRACTION_MAX_OUTPUT_TOKENS:-5000}
  LLM_WORLD_SETTING_EXTRACTION_RETRY_MAX_OUTPUT_TOKENS: ${LLM_WORLD_SETTING_EXTRACTION_RETRY_MAX_OUTPUT_TOKENS:-10000}
  LLM_SUBJECT_RESOLUTION_MAX_OUTPUT_TOKENS: ${LLM_SUBJECT_RESOLUTION_MAX_OUTPUT_TOKENS:-2000}
  LLM_COMPARISON_MAX_OUTPUT_TOKENS: ${LLM_COMPARISON_MAX_OUTPUT_TOKENS:-3000}
  LLM_WORLD_SETTING_BATCH_COMPARISON_MAX_OUTPUT_TOKENS: ${LLM_WORLD_SETTING_BATCH_COMPARISON_MAX_OUTPUT_TOKENS:-16000}
  LLM_PROVIDER_MAX_OUTPUT_TOKENS: ${LLM_PROVIDER_MAX_OUTPUT_TOKENS:-128000}
  OPENAI_RESPONSES_API_URL: ${OPENAI_RESPONSES_API_URL:-https://api.openai.com/v1/responses}
  LLM_HTTP_MAX_RETRIES: ${LLM_HTTP_MAX_RETRIES:-3}
  LLM_HTTP_RETRY_BASE_SECONDS: ${LLM_HTTP_RETRY_BASE_SECONDS:-2}
  AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-10}
  LLM_MAX_CONCURRENT_REQUESTS: ${LLM_MAX_CONCURRENT_REQUESTS:-10}
  AI_WORKER_BLOCKING_MAX_WORKERS: ${AI_WORKER_BLOCKING_MAX_WORKERS:-3}
  AI_WORKER_IDLE_SLEEP_SECONDS: ${AI_WORKER_IDLE_SLEEP_SECONDS:-5}
  AI_WORKER_SHUTDOWN_GRACE_SECONDS: ${AI_WORKER_SHUTDOWN_GRACE_SECONDS:-180}
  EMBEDDING_GENERATION_ENABLED: ${EMBEDDING_GENERATION_ENABLED:-false}
  SPRING_INTERNAL_API_BASE_URL: ${SPRING_INTERNAL_API_BASE_URL:?SPRING_INTERNAL_API_BASE_URL is required}
  SPRING_INTERNAL_API_KEY: ${SPRING_INTERNAL_API_KEY:?SPRING_INTERNAL_API_KEY is required}

x-worker-service: &worker-service
  image: ${AI_IMAGE:?AI_IMAGE is required}
  restart: unless-stopped
  logging:
    driver: journald
  stop_grace_period: 210s

services:
  ai-worker:
    <<: *worker-service
    deploy:
      replicas: ${AI_WORKER_PROCESS_COUNT:-5}
    environment:
      <<: *worker-environment

  ai-character-comparison-worker:
    <<: *worker-service
    command: ["python", "scripts/run_analysis_worker.py", "--worker-kind", "character-comparison"]
    environment:
      <<: *worker-environment
      DATABASE_POOL_SIZE: 1
      DATABASE_POOL_MAX_OVERFLOW: 0
      AI_WORKER_CONCURRENCY: 1
      LLM_MAX_CONCURRENT_REQUESTS: 1
      AI_WORKER_BLOCKING_MAX_WORKERS: 1
      EMBEDDING_GENERATION_ENABLED: "false"

  ai-world-comparison-worker:
    <<: *worker-service
    command: ["python", "scripts/run_analysis_worker.py", "--worker-kind", "world-comparison"]
    environment:
      <<: *worker-environment
      DATABASE_POOL_SIZE: 1
      DATABASE_POOL_MAX_OVERFLOW: 0
      AI_WORKER_CONCURRENCY: 1
      LLM_MAX_CONCURRENT_REQUESTS: 1
      AI_WORKER_BLOCKING_MAX_WORKERS: 1
      EMBEDDING_GENERATION_ENABLED: "false"
